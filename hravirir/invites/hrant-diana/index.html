.play.on { background: #000; } .play.on i { border: 0; width: 12px; height: 13px; margin: 0; border-left: 4px solid #fff; border-right: 4px solid #fff; }

.hero .down { position: absolute; left: 50%; bottom: 26px; width: 26px; height: 26px; margin-left: -13px; border: 0; background: none; cursor: pointer; animation: bob 2s ease-in-out infinite; }
.hero .down::before { content: ""; position: absolute; left: 6px; top: 3px; width: 13px; height: 13px; border-right: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(45deg); }
@keyframes bob { 50% { transform: translateY(6px); } }

<script>
(function () {

  var T = new Date(2026, 9, 18, 0, 0, 0).getTime(), el = document.getElementById("cd");
  function p(n) { return (n < 10 ? "0" : "") + n; }
  function tick() {
    var g = Math.max(0, T - Date.now()), s = Math.floor(g / 1000);
    var v = { d: Math.floor(s / 86400), h: Math.floor(s % 86400 / 3600), m: Math.floor(s % 3600 / 60), s: s % 60 };
    el.querySelectorAll("b").forEach(function (b) { b.textContent = p(v[b.dataset.k]); });
  }
  tick(); setInterval(tick, 1000);
  // երաժշտություն
  var a = document.getElementById("music"), pl = document.getElementById("play");
  pl.onclick = function () { if (a.paused) { a.play(); pl.classList.add("on"); } else { a.pause(); pl.classList.remove("on"); } };
  // վերնագոտին սպիտակ է դառնում թերթելիս
  var bar = document.getElementById("bar");
  function sc() { bar.classList.toggle("on", scrollY > 40); }
  addEventListener("scroll", sc, { passive: true }); sc();
  // կիսվել
  document.getElementById("share").onclick = function () {
    if (navigator.share) navigator.share({ title: document.title, url: location.href }).catch(function () {});
    else if (navigator.clipboard) navigator.clipboard.writeText(location.href);
  };
})();
