    document.getElementById("app").innerHTML = (opened ? "" : env()) + "<main>" + hero() + story() + countdown() + program() + rsvp() + fin() + "</main>" + (opened ? K.chrome() : "");
    if (!opened) document.getElementById("ph").onclick = open; else K.reveal();
    K.countdown(true); K.rsvp(document.getElementById("rf")); K.bindChrome(render);
  }
  function open() {
    var e = document.getElementById("env"); if (e.classList.contains("open")) return;
    K.music.play(); e.classList.add("open"); document.body.classList.remove("locked"); opened = true;
    setTimeout(K.reveal, 500);
    document.getElementById("app").insertAdjacentHTML("beforeend", K.chrome()); K.bindChrome(render);
    setTimeout(function () { e.remove(); }, 1300);
  }
  render();
  if (K.PREVIEW) open();
})();
</script>
</body>
</html>
